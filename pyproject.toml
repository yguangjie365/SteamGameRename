[project]
name = "steam-cn-renamer"
version = "1.0.0"
description = "将 Steam 库游戏名称改为中文的本地工具（appinfo v42）"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steam-cn-renamer = "cli:main"
steam-cn-renamer-editor = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 扁平布局：src 下直接是顶层模块（无包名嵌套）
[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]
py-modules = [
  "backup",
  "cli",
  "community",
  "db",
  "game_names",
  "gui",
  "mapping",
  "paths",
  "pinyin",
  "shard",
  "steam_locator",
  "store",
  "vdf",
  "version",
]

# 静态资源安装到 share/，paths.asset_dir() 会回退到这里
[tool.setuptools.data-files]
"share/steam-cn-renamer/web" = ["src/web/index.html"]
"share/steam-cn-renamer/defaults" = ["src/defaults/names.json", "src/defaults/game_names.csv", "src/defaults/original_names.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
